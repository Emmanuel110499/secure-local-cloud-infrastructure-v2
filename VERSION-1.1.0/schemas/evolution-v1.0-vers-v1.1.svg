<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Évolution de Secure Local Cloud entre v1.0 et v1.1</title><desc id="desc">La version locale dépendante du PC devient une plateforme VPS autonome avec extensions Tailscale.</desc>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1769e8"/><stop offset="1" stop-color="#7549e8"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".14"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2768dd"/></marker><style>.h{font:700 30px Arial,sans-serif;fill:#10213d}.sh{font:700 22px Arial,sans-serif;fill:#10213d}.t{font:17px Arial,sans-serif;fill:#566681}.w{font:700 22px Arial,sans-serif;fill:#fff}</style></defs>
  <rect width="1400" height="650" rx="28" fill="#f3f6fc"/><text x="65" y="70" class="h">Du laboratoire local à une plateforme de production autonome</text>
  <g filter="url(#s)"><rect x="70" y="135" width="480" height="420" rx="28" fill="#fff" stroke="#d2dcf0"/><text x="105" y="185" class="sh">v1.0 - laboratoire local</text><rect x="105" y="225" width="410" height="70" rx="18" fill="#eef3fb"/><text x="135" y="267" class="t">PC Windows + VMware Workstation</text><rect x="105" y="325" width="190" height="95" rx="18" fill="#eef3fb"/><text x="132" y="365" class="sh">srv-web</text><text x="132" y="397" class="t">Portail</text><rect x="325" y="325" width="190" height="95" rx="18" fill="#eef3fb"/><text x="345" y="365" class="sh">srv-monitoring</text><text x="345" y="397" class="t">Observabilité</text><text x="105" y="472" class="t">Dépendance au PC et à l'alimentation locale</text><text x="105" y="508" class="t">Disponibilité limitée hors du domicile</text></g>
  <path d="M580 345H790" stroke="#2768dd" stroke-width="7" fill="none" marker-end="url(#a)"/><text x="612" y="315" class="sh">Migration</text><text x="612" y="380" class="t">VPS + Tailscale</text>
  <g filter="url(#s)"><rect x="830" y="135" width="500" height="420" rx="28" fill="#10213d"/><text x="870" y="185" class="w">v1.1 - production distribuée</text><rect x="870" y="225" width="420" height="115" rx="20" fill="url(#g)"/><text x="900" y="270" class="w">VPS Production 24/7</text><text x="900" y="306" style="font:17px Arial,sans-serif;fill:#eef4ff">Portail + monitoring + sauvegardes</text><rect x="870" y="375" width="125" height="95" rx="17" fill="#213657"/><text x="898" y="415" class="w">PC</text><text x="886" y="448" style="font:15px Arial,sans-serif;fill:#d3def2">Windows</text><rect x="1017" y="375" width="125" height="95" rx="17" fill="#213657"/><text x="1038" y="415" class="w">VM web</text><text x="1044" y="448" style="font:15px Arial,sans-serif;fill:#d3def2">Ubuntu</text><rect x="1165" y="375" width="125" height="95" rx="17" fill="#213657"/><text x="1178" y="415" class="w">VM mon.</text><text x="1191" y="448" style="font:15px Arial,sans-serif;fill:#d3def2">Ubuntu</text><text x="870" y="515" style="font:17px Arial,sans-serif;fill:#cdd9ef">PC supervisé + VM hébergées sur le PC, reliés via Tailscale</text></g>
  <text x="70" y="610" class="t">Résultat : le portail reste disponible même lorsque le PC et les machines virtuelles sont arrêtés.</text>
</svg>
