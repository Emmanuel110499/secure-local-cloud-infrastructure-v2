<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Secure Infrastructure{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/dashboard.css') }}"
    >

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
   
      <style>
    .emma-global-button {
        position: fixed;
        right: 22px;
        bottom: 22px;
        z-index: 1000;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 17px;
        color: #ffffff;
        text-decoration: none;
        background: linear-gradient(135deg, #0891b2, #2563eb);
        border-radius: 999px;
        box-shadow: 0 14px 35px rgba(0, 0, 0, 0.28);
        transition:
            transform 0.2s ease,
            box-shadow 0.2s ease;
    }

    .emma-global-button:hover {
        color: #ffffff;
        transform: translateY(-2px);
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.34);
    }

    @media (max-width: 700px) {
        .emma-global-button span {
            display: none;
        }

        .emma-global-button {
            right: 14px;
            bottom: 14px;
            padding: 12px;
            border-radius: 50%;
        }
    }
</style>



<link
    rel="stylesheet"
    href="{{ url_for(
        'static',
        filename='css/premium-global-polish.css',
        v='sections-tables-20260804-131446'
    ) }}"
>

</head>

<body>

<aside class="sidebar">
    <div class="brand">
        Secure <span>Infrastructure</span>
    </div>

    <nav>
        <a class="nav-link-custom" href="/dashboard">Dashboard</a>
        <a class="nav-link-custom" href="/containers">Conteneurs</a>
        <a class="nav-link-custom" href="/monitoring">Monitoring</a>
        <a class="nav-link-custom" href="/infrastructure">Infrastructure</a>

        <a
            class="nav-link-custom"
            href="http://192.168.154.20:3000"
            target="_blank"
        >
            Grafana
        </a>

        <a
            class="nav-link-custom"
            href="http://192.168.154.20:9090"
            target="_blank"
        >
            Prometheus
        </a>
    </nav>

    <div class="sidebar-footer">
        Projet personnel<br>
        Infrastructure Cloud & Sécurité
    </div>
</aside>

<main class="main-content">
    {% block content %}{% endblock %}
</main>

<script
    src="{{ url_for('static', filename='js/dashboard.js') }}"
></script>

{% if request.path != "/assistant" %}

<a
    href="/assistant"
    class="emma-global-button"
    aria-label="Ouvrir Emma_IA"
>
    🤖
    <span>Emma_IA</span>
</a>
{% endif %}


<script
    src="{{ url_for(
        'static',
        filename='js/recent-pages.js',
        v='recent-global-20260804-002621'
    ) }}"
></script>

</body>
</html>
