global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "srv-web"
    static_configs:
      - targets:
          - "192.168.50.10:9100"

  - job_name: "cadvisor"
    static_configs:
      - targets:
          - "192.168.50.10:8080"